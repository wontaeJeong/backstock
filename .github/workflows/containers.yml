name: Container artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish SHA-tagged images to GHCR (no deployment)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: container-release
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      matrix:
        image: [api, web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          push: ${{ inputs.publish }}
          tags: ghcr.io/wontaejeong/backstock-${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
